<svg xmlns="http://www.w3.org/2000/svg" width="200" height="100" viewBox="0 0 200 100">
    <style>
        /* Set transform origin for each circle to its center */
        .bubbles-button circle:nth-child(1) { transform-origin: 20px 50px; }
        .bubbles-button circle:nth-child(2) { transform-origin: 60px 60px; }
        .bubbles-button circle:nth-child(3) { transform-origin: 100px 50px; }
        .bubbles-button circle:nth-child(4) { transform-origin: 140px 60px; }
        .bubbles-button circle:nth-child(5) { transform-origin: 180px 50px; }

        /* The bounce animation - each circle scales and moves */
        @keyframes waveBounce {
        0% {
        transform: scale(1) translateY(0);
        }
        15% {
        transform: scale(1.3) translateY(-15px); /* Jump up and grow */
        }
        30% {
        transform: scale(0.9) translateY(5px); /* Land and squash */
        }
        50% {
        transform: scale(1.1) translateY(-5px); /* Mini bounce */
        }
        70% {
        transform: scale(0.95) translateY(2px); /* Settle */
        }
        100% {
        transform: scale(1) translateY(0); /* Rest */
        }
        }

        .bubbles-button circle {
        animation-play-state: paused;
        transform-origin: center center; /* Fallback */
        }

        /* Each circle gets a different delay for the wave effect */
        .bubbles-button circle:nth-child(1) { animation-delay: 0.0s; }
        .bubbles-button circle:nth-child(2) { animation-delay: 0.12s; }
        .bubbles-button circle:nth-child(3) { animation-delay: 0.24s; }
        .bubbles-button circle:nth-child(4) { animation-delay: 0.36s; }
        .bubbles-button circle:nth-child(5) { animation-delay: 0.48s; }

        /* Start the wave on hover */
        svg:hover .bubbles-button circle {
        animation: waveBounce 0.8s ease-in-out infinite;
        animation-play-state: running;
        }
    </style>

    <g class="bubbles-button">
        <circle fill="hotpink" r="35" cx="20" cy="50" />
        <circle fill="hotpink" r="35" cx="60" cy="60" />
        <circle fill="hotpink" r="40" cx="100" cy="50" />
        <circle fill="hotpink" r="35" cx="140" cy="60" />
        <circle fill="hotpink" r="35" cx="180" cy="50" />
    </g>
</svg>